const container = bm.container;
let scrollObserver = null;

/* ── 스크롤 감지 초기화 ─────────────────────────────── */
function initScrollObserver() {
  if (scrollObserver) scrollObserver.disconnect();
  const header   = container.querySelector('.gnb-header');
  const sentinel = container.querySelector('.gnb-sentinel');
  if (!header || !sentinel) return;
  scrollObserver = new IntersectionObserver(
    ([entry]) => { header.classList.toggle('is-scrolled', !entry.isIntersecting); },
    { threshold: 0 }
  );
  scrollObserver.observe(sentinel);
}

/* ── 모바일 메뉴 열기/닫기 ──────────────────────────── */
function toggleMobileMenu(forceOpen) {
  const header     = container.querySelector('.gnb-header');
  const mobileMenu = container.querySelector('.gnb-mobile-menu');
  const hamburger  = container.querySelector('.gnb-hamburger');
  const overlay    = container.querySelector('.gnb-overlay');
  if (!header || !mobileMenu || !hamburger) return;
  const isOpen = (typeof forceOpen === 'boolean')
    ? forceOpen
    : !header.classList.contains('menu-open');
  header.classList.toggle('menu-open', isOpen);
  hamburger.setAttribute('aria-expanded', String(isOpen));
  hamburger.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
  mobileMenu.setAttribute('aria-hidden', String(!isOpen));
  if (overlay) overlay.classList.toggle('is-active', isOpen);
}

/* ── 서브메뉴 아코디언 ──────────────────────────────── */
function toggleSubMenu(btn) {
  const item = btn.closest('.gnb-mobile-item--sub');
  if (!item) return;
  const isOpen = item.classList.toggle('sub-open');
  btn.setAttribute('aria-expanded', String(isOpen));
  const sub = item.querySelector('.gnb-mobile-sub');
  if (sub) sub.setAttribute('aria-hidden', String(!isOpen));
}

/* ── 이벤트 위임 (컨테이너 단일 핸들러) ─────────────── */
container.addEventListener('click', (e) => {
  if (e.target.closest('.gnb-hamburger')) {
    e.preventDefault();
    toggleMobileMenu();
    return;
  }
  if (e.target.closest('.gnb-overlay')) {
    e.preventDefault();
    toggleMobileMenu(false);
    return;
  }
  if (e.target.closest('.gnb-mobile-btn')) {
    e.preventDefault();
    toggleSubMenu(e.target.closest('.gnb-mobile-btn'));
    return;
  }
}, true);

/* ── 초기화 및 라이프사이클 ─────────────────────────── */
initScrollObserver();
bm.onContextChange = () => { initScrollObserver(); };
bm.onDestroy = () => { if (scrollObserver) scrollObserver.disconnect(); };
</script>
