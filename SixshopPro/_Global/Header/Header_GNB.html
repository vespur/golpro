<data value="$customer" />
<data value="$page" />

<style>
/* =====================================================
   GOLPRO GNB v8
   주요 변경:
   1. 그림자 완화 + border-bottom 제거
   2. 프로그레스바 하단 라인 제거
   3. 드롭다운 화살표 애니메이션 UX
   4. SNS 6종 (스레드/카카오/네이버블로그/페이스북 추가)
   6. 회원 등급 설정 (memberGradeLabel)
   7. 배너 Desktop/Mobile 텍스트 분리
   8. 드로어 하위메뉴 dot → 포인트 컬러
   9. 글래스모피즘 설정 (blur/saturation/opacity)
   10. 설정 패널 완전 재설계
   11. 프로필 사진 제거
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
@font-face {
  font-family: 'Giants';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-1@1.1/Giants-Bold.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
a { text-decoration: none; color: inherit; }
ul, ol { list-style: none; }
button { border: none; background: none; cursor: pointer; font: inherit; padding: 0; }
svg { display: block; flex-shrink: 0; }

/* =====================================================
   PLACEHOLDER
===================================================== */
.gp-placeholder {
  /* 배너 없을 때: headerHeight / 배너 있을 때: headerHeight + bannerH(CSS로 못 더하므로 JS 처리) */
  height: {{property.headerHeight}}px;
  width: 100%;
  transition: height 0.28s cubic-bezier(0.4,0,0.2,1);
}
.gp-placeholder.banner-active { height: calc({{property.headerHeight}}px + 36px); }
@media (max-width: {{property.mobileBreak}}px) {
  .gp-placeholder { height: {{property.headerHeightM}}px; }
  .gp-placeholder.banner-active { height: calc({{property.headerHeightM}}px + 36px); }
}

/* =====================================================
   [4] BANNER — fixed, z-index 1001 (GNB 위)
   [7] Desktop / Mobile 텍스트 분리
===================================================== */
/* =====================================================
   [분리버그 FIX] gp-sticky-group
   띠배너 + GNB를 하나의 fixed wrapper로 묶어
   transform 1회로 함께 이동 → 분리 현상 원천 차단
===================================================== */
.gp-sticky-group {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1001;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}
.gp-sticky-group.hide-up { transform: translateY(-36px); }

.gp-banner {
  position: relative;
  top: auto; left: auto; right: auto;
  z-index: auto;
  width: 100%;
  background: {{property.bannerBg}};
  display: none;
  /* transition 제거: sticky-group이 담당 */
}
.gp-banner.is-home { display: block; }
/* hide-up: gp-sticky-group.hide-up으로 통합됨 */
.gp-banner-inner {
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
}
.gp-banner-txt {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  color: {{property.bannerColor}};
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* [7] 모바일에서 모바일 전용 문구 표시 */
.gp-banner-txt-m { display: none; }
@media (max-width: {{property.mobileBreak}}px) {
  .gp-banner-txt   { display: none; }
  .gp-banner-txt-m { display: block; font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 500; color: {{property.bannerColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

/* =====================================================
   HEADER — position:fixed
   [9] 글래스모피즘 설정값 Handlebars 직접 주입
===================================================== */
.gp-header {
  position: relative; /* gp-sticky-group이 fixed 담당 */
  top: auto;
  left: auto; right: auto;
  z-index: auto;
  width: 100%;
  background: rgba(10, 12, 17, {{property.glassBgOpacity}});
  backdrop-filter: blur({{property.glassBlur}}px) saturate({{property.glassSaturation}}%);
  -webkit-backdrop-filter: blur({{property.glassBlur}}px) saturate({{property.glassSaturation}}%);
  border-bottom: none;
  transition: background 0.3s ease, box-shadow 0.3s ease;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* 배너 활성(홈+showBanner) → 헤더를 배너 아래로 */
/* .gp-header.banner-active top: gp-sticky-group 구조로 자동 처리됨 */
.gp-header.is-scrolled {
  background: rgba(8, 10, 14, {{property.glassBgOpacityScrolled}});
  box-shadow: 0 1px 16px rgba(0,0,0,0.28);
}

/* [2] 프로그레스바 — 하단 라인 없이 진행률만 */
.gp-progress {
  position: absolute;
  top: 100%; left: 0;
  height: 0;
  width: 0%;
  background: transparent;
  z-index: 10;  /* 헤더 내부에서 최상위 */
  pointer-events: none;
  transition: width 0.05s linear;
  will-change: width;
}

/* Inner */
.gp-inner {
  height: {{property.headerHeight}}px;
  max-width: {{property.maxWidth}}px;
  margin: 0 auto;
  padding: 0 {{property.paddingH}}px;
  display: flex;
  align-items: center;
  position: relative; /* 메뉴 절대 중앙정렬을 위한 기준점 */
}

/* =====================================================
   LOGO
===================================================== */
.gp-logo { flex-shrink: 0; margin-right: 24px; }
.gp-logo-link {
  display: flex; align-items: center;
  height: {{property.headerHeight}}px;
}
.gp-logo-text {
  font-family: 'Giants', sans-serif;
  font-size: {{property.logoSize}}px;
  font-weight: 700;
  letter-spacing: {{property.logoLetterSpacing}}em;
  color: {{property.logoColor}};
  line-height: 1;
  transition: opacity 0.18s;
}
.gp-logo-link:hover .gp-logo-text { opacity: 0.7; }
.gp-logo-img { height: {{property.logoImgH}}px; width: auto; display: block; }

/* =====================================================
   DESKTOP NAV
===================================================== */
.gp-nav {
  /* [UX FIX] 좌우 요소 너비에 무관하게 뷰포트 정중앙 고정
     position:absolute + left:50% + translateX(-50%)
     → 로고/SNS 아이콘 수와 관계없이 항상 화면 중앙 */
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center;
  height: {{property.headerHeight}}px;
  pointer-events: none; /* gp-inner 클릭 통과 (메뉴 자체는 아래서 별도 복원) */
}
.gp-nav > * { pointer-events: auto; } /* 메뉴 아이템 클릭 복원 */
.gp-menu { display: flex; align-items: stretch; height: 100%; }
.gp-item { position: relative; display: flex; align-items: center; }
.gp-link {
  display: flex; align-items: center; gap: 3px;
  padding: 0 {{property.menuPadH}}px;
  height: 100%;
  font-size: {{property.menuSize}}px; font-weight: 500;
  color: {{property.menuColor}};
  white-space: nowrap; position: relative;
  transition: color 0.18s; letter-spacing: -0.01em;
}
.gp-link::after {
  content: '';
  position: absolute; bottom: 0;
  left: {{property.menuPadH}}px; right: {{property.menuPadH}}px;
  height: 2px; background: {{property.accentColor}};
  transform: scaleX(0); transform-origin: center;
  transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
}
.gp-item:hover .gp-link { color: rgba(255,255,255,0.95); }
.gp-item:not(.has-drop):hover .gp-link::after { transform: scaleX(1); }
.gp-caret {
  width: 8px; height: 5px; opacity: 0.45; flex-shrink: 0;
  transition: transform 0.2s, opacity 0.18s;
}
.gp-item.has-drop:hover .gp-caret { transform: rotate(180deg); opacity: 1; }

/* =====================================================
   [3] DROPDOWN — 화살표 애니메이션 UX
===================================================== */
.gp-drop {
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 200px;
  width: max-content;
  background: rgba(12, 14, 20, 0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: {{property.dropRadiusTop}}px {{property.dropRadiusTop}}px {{property.dropRadiusBottom}}px {{property.dropRadiusBottom}}px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.25);
  padding: 5px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(-4px);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s 0.18s;
  z-index: 999;
}
.gp-item:last-child .gp-drop,
.gp-item:nth-last-child(2) .gp-drop { left: auto; right: 0; }
.gp-item.has-drop::before {
  content: ''; position: absolute;
  bottom: -2px; left: 0; right: 0; height: 2px;
}
.gp-item.has-drop:hover .gp-drop {
  opacity: 1; visibility: visible; pointer-events: auto;
  transform: translateY(0);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s 0s;
}

/* [3] 드롭다운 링크 — 화살표 슬라이드 UX */
.gp-drop-link {
  display: flex; align-items: center;
  padding: 9px 12px 9px 14px;
  font-size: 13.5px; font-weight: 400;
  color: rgba(255,255,255,0.58);
  border-radius: 7px;
  transition: color 0.16s, background 0.16s;
  white-space: nowrap;
  gap: 8px;
  position: relative;
  overflow: hidden;
}
/* 좌측 인디케이터 dot */
.gp-drop-link::before {
  content: '';
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(255,255,255,0.22);
  flex-shrink: 0;
  transition: background 0.16s, transform 0.16s;
}
/* 우측 화살표 — 평시 opacity:0, 살짝 왼쪽에서 */
.gp-drop-link-arrow {
  margin-left: auto;
  flex-shrink: 0;
  color: {{property.accentColor}};
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.gp-drop-link:hover {
  color: rgba(255,255,255,0.95);
  background: rgba(255,255,255,0.06);
}
.gp-drop-link:hover::before { background: {{property.accentColor}}; transform: scale(1.4); }
.gp-drop-link:hover .gp-drop-link-arrow { opacity: 1; transform: translateX(0); }

.gp-drop-sep { height: 1px; background: rgba(255,255,255,0.07); margin: 4px 0; }

/* =====================================================
   USER ICON HOVER DROPDOWN — [11] 프로필사진 없음
===================================================== */
.gp-user-wrap {
  position: relative;
  display: flex; align-items: center;
  align-self: stretch; /* gp-item처럼 GNB 전체 높이 → top:100%가 GNB 하단 기준 */
}
.gp-user-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}
.gp-user-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.22); color: #fff; }

.gp-user-drop {
  position: absolute; top: 100%; right: 0;
  width: 200px;
  background: rgba(12, 14, 20, 0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: {{property.dropRadiusTop}}px {{property.dropRadiusTop}}px {{property.dropRadiusBottom}}px {{property.dropRadiusBottom}}px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.25);
  padding: 5px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(-4px);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s 0.18s;
  z-index: 1001;
}
.gp-user-wrap:hover .gp-user-drop {
  opacity: 1; visibility: visible; pointer-events: auto;
  transform: translateY(0);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s 0s;
}
.gp-user-info {
  padding: 10px 12px 9px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  margin-bottom: 4px;
}
.gp-user-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: -0.01em; }
/* [6] 회원 등급 */
.gp-user-grade { font-size: 11px; color: {{property.accentColor}}; margin-top: 2px; font-weight: 500; letter-spacing: 0.02em; }

.gp-user-action {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 9px 12px;
  font-size: 13.5px; font-weight: 400;
  color: rgba(255,255,255,0.58);
  border-radius: 7px;
  transition: color 0.15s, background 0.15s;
  text-align: left;
}
.gp-user-action:hover { color: rgba(255,255,255,0.95); background: rgba(255,255,255,0.06); }
.gp-user-logout { color: rgba(255,80,80,0.7); }
.gp-user-logout:hover { color: rgba(255,90,90,1); background: rgba(255,50,50,0.08); }

/* =====================================================
   UTILITY (비로그인)
===================================================== */
.gp-util { flex-shrink: 0; display: flex; align-items: center; align-self: stretch; gap: 2px; margin-left: auto; position: relative; z-index: 1; }
.gp-sns { display: flex; align-items: center; gap: 0; padding-right: 4px; margin-right: 4px; }
.gp-sns-a {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 7px;
  color: rgba(255,255,255,0.3);
  transition: color 0.15s, background 0.15s;
}
.gp-sns-a:hover { color: rgba(255,255,255,0.82); background: rgba(255,255,255,0.07); }

.gp-util-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.12); margin: 0 3px; }
.gp-util-btn {
  padding: 5px 10px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.5); border-radius: 6px; white-space: nowrap;
  transition: color 0.15s, background 0.15s;
}
.gp-util-btn:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.07); }
.gp-util-join {
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.05);
}
.gp-util-join:hover { border-color: rgba(255,255,255,0.26); background: rgba(255,255,255,0.1); }

/* =====================================================
   [7] HAMBURGER — 완전 균일한 3선
===================================================== */
.gp-ham {
  display: none; margin-left: auto; flex-shrink: 0;
  align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.gp-ham:hover { background: rgba(255,255,255,0.07); }
.gp-ham-lines { display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
/* [7] 3선 완전 동일 규격 */
.gp-ham-line {
  display: block;
  width: 20px;
  height: 2px;           /* 균일 두께 */
  background: rgba(255,255,255,0.75);
  border-radius: 1px;    /* 균일 라운드 */
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.2s;
  flex-shrink: 0;        /* 축소 방지 */
}

/* =====================================================
   CSS TOGGLE — 드로어 + 햄버거 X
===================================================== */
.gp-toggle { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
.gp-toggle:checked ~ .gp-sticky-group .gp-ham-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.gp-toggle:checked ~ .gp-sticky-group .gp-ham-line:nth-child(2) { opacity: 0; }
.gp-toggle:checked ~ .gp-sticky-group .gp-ham-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Overlay */
.gp-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 1100;
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s, visibility 0s 0.3s;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.gp-toggle:checked ~ .gp-overlay { opacity: 1; visibility: visible; transition: opacity 0.3s; }

/* Drawer */
.gp-drawer {
  position: fixed; top: 0; right: 0;
  width: {{property.drawerWidth}}px; max-width: 88vw;
  height: 100dvh;
  background: {{property.drawerBg}};
  z-index: 1101;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.36s cubic-bezier(0.16,1,0.3,1);
  font-family: 'Inter', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.gp-toggle:checked ~ .gp-drawer { transform: translateX(0); }

/* Drawer Head */
.gp-dhead {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid {{property.drawerDividerColor}};
  flex-shrink: 0;
}
.gp-dhead-logo {
  font-family: 'Giants', sans-serif; font-size: {{property.drawerLogoSize}}px; font-weight: 700;
  letter-spacing: {{property.logoLetterSpacing}}em; color: {{property.logoColor}};
}
.gp-dclose {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 7px;
  color: rgba(255,255,255,0.32); cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.gp-dclose:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }

/* Drawer User — [11] 프로필 사진 없음 */
.gp-duser {
  padding: 16px 20px;
  border-bottom: 1px solid {{property.drawerDividerColor}};
  flex-shrink: 0;
}
.gp-duser-info { margin-bottom: 12px; }
/* [6] 닉네임 + 등급 */
.gp-duser-name { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.88); letter-spacing: -0.01em; }
.gp-duser-grade { font-size: 11.5px; color: {{property.accentColor}}; margin-top: 3px; font-weight: 500; letter-spacing: 0.02em; }
.gp-duser-sub   { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 1px; }

.gp-duser-btns { display: flex; gap: 8px; }
.gp-duser-mypage {
  flex: 1; text-align: center; display: block;
  padding: 9px 0; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; transition: background 0.15s;
}
.gp-duser-mypage:hover { background: rgba(255,255,255,0.13); }
.gp-duser-logout {
  padding: 9px 14px; font-size: 13px;
  color: rgba(255,80,80,0.7); background: rgba(255,50,50,0.07);
  border: 1px solid rgba(255,50,50,0.14); border-radius: 8px;
  transition: background 0.15s;
}
.gp-duser-logout:hover { background: rgba(255,50,50,0.13); }
.gp-dauth { display: flex; gap: 8px; }
.gp-dauth-login {
  flex: 1; display: block; text-align: center;
  padding: 11px 0; font-size: 14px; font-weight: 700;
  background: {{property.accentColor}}; color: #fff; border-radius: 8px;
  transition: opacity 0.15s;
}
.gp-dauth-login:hover { opacity: 0.82; }
.gp-dauth-signup {
  flex: 1; display: block; text-align: center;
  padding: 11px 0; font-size: 14px; font-weight: 500;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.8); border-radius: 8px;
  transition: background 0.15s;
}
.gp-dauth-signup:hover { background: rgba(255,255,255,0.13); }

/* =====================================================
   ACCORDION (JS 단일 오픈)
===================================================== */
.gp-dscroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.gp-dscroll::-webkit-scrollbar { display: none; }
.gp-ditem { border-bottom: 1px solid {{property.drawerDividerColor}}; }
.gp-drow {
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; padding: 0 20px;
  cursor: pointer; transition: background 0.15s; user-select: none;
}
.gp-drow:hover { background: rgba(255,255,255,0.03); }
.gp-drow-title {
  font-size: {{property.drawerMenuSize}}px; font-weight: 500;
  color: rgba(255,255,255,0.82); flex: 1;
}
.gp-dacc {
  width: 24px; height: 24px; position: relative; flex-shrink: 0;
  color: rgba(255,255,255,0.35); transition: color 0.2s;
}
.gp-dacc::before, .gp-dacc::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  background: currentColor; border-radius: 1px;
  transition: transform 0.24s cubic-bezier(0.4,0,0.2,1), opacity 0.2s;
}
.gp-dacc::before { width: 11px; height: 1.5px; transform: translate(-50%,-50%); }
.gp-dacc::after  { width: 1.5px; height: 11px; transform: translate(-50%,-50%); }
.gp-ditem.is-open .gp-dacc { color: rgba(255,255,255,0.5); }
.gp-ditem.is-open .gp-dacc::after { transform: translate(-50%,-50%) scaleY(0); opacity: 0; }

.gp-dsub { max-height: 0; overflow: hidden; background: {{property.drawerSubBg}}; transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1); }
.gp-ditem.is-open .gp-dsub { max-height: 500px; }

/* [8] 하위 메뉴 dot → 포인트 컬러 */
.gp-dsub-link {
  display: flex; align-items: center;
  padding: 10px 20px 10px 32px;
  font-size: 13.5px; font-weight: 400;
  color: rgba(255,255,255,0.42);
  position: relative; transition: color 0.15s;
}
.gp-dsub-link::before {
  content: '';
  position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 3px; border-radius: 50%;
  /* [8] 포인트 컬러 */
  background: {{property.accentColor}};
  opacity: 0.5;
  transition: opacity 0.15s, transform 0.15s;
}
.gp-dsub-link:hover { color: rgba(255,255,255,0.88); }
.gp-dsub-link:hover::before { opacity: 1; transform: translateY(-50%) scale(1.4); }

/* Drawer 하단 SNS */
.gp-dsns-bar {
  flex-shrink: 0; padding: 14px 20px;
  border-top: 1px solid {{property.drawerDividerColor}};
  display: flex; align-items: center; gap: 4px;
}
.gp-dsns-a {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px;
  color: rgba(255,255,255,0.3);
  transition: color 0.15s, background 0.15s;
}
.gp-dsns-a:hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.07); }

/* =====================================================
   RESPONSIVE
===================================================== */
@media (max-width: {{property.mobileBreak}}px) {
  .gp-nav, .gp-util { display: none !important; }
  .gp-ham { display: flex; }
  .gp-inner { height: {{property.headerHeightM}}px; padding: 0 {{property.paddingHM}}px; }
  .gp-logo-text { font-size: {{property.logoSizeM}}px; }
  .gp-logo-img  { height: {{property.logoImgHM}}px; }
}
@media (min-width: {{property.mobileBreak}}px) {
  .gp-overlay, .gp-drawer { display: none !important; }
}

<script>
var container = bm.container;
var doc = container.ownerDocument;
var win = doc.defaultView;
var BANNER_H = 36;
var _raf = false;

/* =====================================================
   Progress bar
===================================================== */
function updateProgress() {
  var el = container.querySelector('.gp-progress');
  if (!el) return;
  var se = doc.documentElement;
  var st = se.scrollTop || doc.body.scrollTop;
  var sm = se.scrollHeight - se.clientHeight;
  if (sm > 0 && st > 0) {
    el.style.height = '2px';
    el.style.background = bm.context.property.accentColor || '#A17F44';
    el.style.width = (st / sm * 100).toFixed(2) + '%';
  } else {
    el.style.height = '0';
    el.style.background = 'transparent';
    el.style.width = '0%';
  }
}

/* =====================================================
   Banner + Header 상태 동기화
===================================================== */
function syncBannerState() {
  var group = doc.getElementById('gpStickyGroup') || container.querySelector('.gp-sticky-group');
  var placeholder = container.querySelector('.gp-placeholder');
  var banner = container.querySelector('.gp-banner');
  var header = container.querySelector('.gp-header');
  var st = doc.documentElement.scrollTop || doc.body.scrollTop;
  var hasBanner = banner && banner.classList.contains('is-home');

  if (hasBanner) {
    var show = st < BANNER_H;
    /* [분리버그 FIX] gp-sticky-group 전체를 translateY(-36px)로 올림
       띠배너 + GNB가 하나의 단위로 완벽히 동기화되어 이동
       → 분리 현상 물리적으로 불가 */
    if (group) group.classList.toggle('hide-up', !show);
    if (placeholder) placeholder.classList.toggle('banner-active', show);
  } else {
    if (group) group.classList.remove('hide-up');
  }
  if (header) header.classList.toggle('is-scrolled', st > 10);
}

/* =====================================================
   [v9] rAF throttle — 스크롤 성능 개선
===================================================== */
function onScroll() {
  if (_raf) return;
  _raf = true;
  win.requestAnimationFrame(function() {
    _raf = false;
    updateProgress();
    syncBannerState();
  });
}

onScroll();
doc.addEventListener('scroll', onScroll, { passive: true });

/* =====================================================
   이벤트 위임
===================================================== */
container.addEventListener('click', function(e) {
  /* 로그아웃 */
  if (e.target.closest('.js-logout')) { e.preventDefault(); bm.do('logout'); return; }

  /* 드로어 메뉴 행 클릭 */
  var row = e.target.closest('.js-acc-row');
  if (!row) return;
  var item = row.closest('.gp-ditem');
  if (!item) return;

  /* [v9 버그수정] 하위메뉴 없으면 data-href 경유 페이지 이동 */
  var hasSub = !!item.querySelector('.gp-dsub');
  if (!hasSub) {
    var href = row.dataset.href;
    if (href) win.location.href = href;
    return;
  }

  /* 하위메뉴 있으면 아코디언 단일 오픈 토글 */
  var isOpen = item.classList.contains('is-open');
  var all = container.querySelectorAll('.gp-ditem');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('is-open');
  if (!isOpen) item.classList.add('is-open');

}, true);

bm.onContextChange = function() { syncBannerState(); updateProgress(); };
/* ESC 키로 드로어 닫기 (접근성) */
function onKeydown(e) {
  if (e.key !== 'Escape') return;
  var toggle = container.querySelector('.gp-toggle');
  if (toggle && toggle.checked) toggle.checked = false;
}
doc.addEventListener('keydown', onKeydown);

bm.onDestroy = function() {
  doc.removeEventListener('scroll', onScroll);
  doc.removeEventListener('keydown', onKeydown);
};
</script>
