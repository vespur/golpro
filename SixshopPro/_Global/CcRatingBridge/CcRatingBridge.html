<style>

.ccRatingRoot {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
  padding: 0;
  margin: -1px;
}

</style>

<template>

<div class="ccRatingRoot" aria-hidden="true">
  <textarea
    class="ccRatingStore"
    data-type="cc-rating-bridge"
    readonly
    aria-hidden="true"
  ></textarea>
</div>

</template>

<script>

(function () {
  var container = bm.container;
  var context = bm.context;

  function log() {
    if (context.property.debugLog) {
      var args = Array.prototype.slice.call(arguments);
      args.unshift('[CC Rating Bridge]');
      console.log.apply(console, args);
    }
  }

  var MARKER_REGEX = /\[\u025e\u025e!--CC_RATING:(.*?)--\u025e\u025e\]/g;
  var allCollectedPosts = [];
  var currentScanPage = 1;
  var postsPerPage = 0;
  var lastSnapshot = '';
  var hasWrittenStore = false;

  function parseMarkers(posts) {
    var ratings = [];
    for (var p = 0; p < posts.length; p++) {
      var content = posts[p].contents || '';
      var match;
      MARKER_REGEX.lastIndex = 0;
      while ((match = MARKER_REGEX.exec(content)) !== null) {
        try {
          var data = JSON.parse(match[1]);
          if (data && data.ccId && data.ratings && data.userKey && data.createdAt) {
            ratings.push(data);
          }
        } catch (err) {
          log('Marker parse error:', err);
        }
      }
    }
    return ratings;
  }

  function writeStore(ratings, boardSummary) {
    var store = container.querySelector('.ccRatingStore');
    if (!store) return;
    var payload = {
      boardId: boardSummary.id,
      boardName: boardSummary.name,
      ratings: ratings,
      collectedAt: new Date().toISOString(),
      totalPosts: allCollectedPosts.length,
      pagesScanned: currentScanPage
    };
    var jsonStr = JSON.stringify(payload);
    if (store.textContent !== jsonStr) {
      store.textContent = jsonStr;
      log('Wrote', ratings.length, 'ratings from', allCollectedPosts.length, 'posts, boardId:', payload.boardId);
    }
  }

  function snapshotBoard() {
    var board = context.property.board;
    if (!board) return 'none';
    var postCount = (board.posts && board.posts.count) || 0;
    var dataLen = (board.posts && board.posts.data && board.posts.data.length) || 0;
    var page = (board.posts && board.posts.page) || 1;
    return (board.id || 'none') + '|' + postCount + '|' + dataLen + '|p' + page;
  }

  /* Process current board state passively. No bm.apply() calls — ever.
     Sixshop will naturally re-fire onContextChange when board data arrives. */
  function processCurrentState() {
    var board = context.property.board;
    var summary = {
      id: (board && board.id) ? board.id : null,
      name: (board && board.name) ? board.name : ''
    };

    /* No board or no data yet: write empty store once */
    if (!board || !board.id || !board.posts || !board.posts.data) {
      if (!hasWrittenStore) {
        log('No board selected, writing empty store');
        writeStore([], summary);
        hasWrittenStore = true;
      }
      return;
    }

    var posts = board.posts.data || [];
    var totalCount = board.posts.count || 0;
    var currentPage = (board.posts.page) || 1;

    /* Only collect NEW pages we haven't processed */
    if (currentPage > currentScanPage || (currentPage === 1 && allCollectedPosts.length === 0)) {
      currentScanPage = currentPage;
      if (currentPage === 1) allCollectedPosts = [];
      for (var i = 0; i < posts.length; i++) {
        allCollectedPosts.push(posts[i]);
      }
      if (currentPage === 1 && posts.length > 0) {
        postsPerPage = posts.length;
      }
      log('Page', currentPage, ':', posts.length, 'posts. Total:', allCollectedPosts.length, '/', totalCount);
    }

    /* Request next page via bm.config ONLY (no apply). Sixshop re-renders naturally on config change. */
    var maxPages = context.property.maxScanPages || 5;
    var totalPages = postsPerPage > 0 ? Math.ceil(totalCount / postsPerPage) : 1;
    var effectiveMax = Math.min(maxPages, totalPages);
    var nextPageNeeded = currentPage < effectiveMax && posts.length > 0;

    if (nextPageNeeded) {
      /* Only request if we haven't already */
      var requestedPage = currentPage + 1;
      try {
        var currentConfigPage = bm.config('property:board.posts.page');
        if (currentConfigPage !== requestedPage) {
          bm.config('property:board.posts.page', requestedPage);
          /* NO bm.apply() — rely on Sixshop's natural re-render. If Sixshop doesn't
             auto-render on config change, scan stalls at current page (acceptable — no infinite loop). */
        }
      } catch (err) {
        log('Config error:', err);
      }
      /* Write interim store with what we have so far */
      writeStore(parseMarkers(allCollectedPosts), summary);
      hasWrittenStore = true;
    } else {
      /* All pages collected (or reached limit): write final store */
      var ratings = parseMarkers(allCollectedPosts);
      writeStore(ratings, summary);
      hasWrittenStore = true;
      log('Scan complete.', ratings.length, 'ratings parsed from', currentScanPage, 'pages');
    }
  }

  /* Initial pass */
  processCurrentState();
  lastSnapshot = snapshotBoard();

  /* React to context changes — but ONLY when actual board data changes.
     Never call bm.apply() from here to avoid Sixshop's "Infinite Loop Detected" warning. */
  bm.onContextChange = function () {
    var newSnapshot = snapshotBoard();
    if (newSnapshot === lastSnapshot) return;
    lastSnapshot = newSnapshot;
    processCurrentState();
  };

  log('Rating Bridge initialized');
})();

</script>
