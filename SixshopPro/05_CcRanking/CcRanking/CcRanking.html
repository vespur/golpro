<style>
.ccRankRoot{width:100%;box-sizing:border-box;padding:{{property.paddingTop}}px {{property.paddingRight}}px {{property.paddingBottom}}px {{property.paddingLeft}}px;font-family:var(--font-family-body);font-weight:var(--font-weight-body);}
.ccRankHeader{margin-bottom:{{property.headerGap}}px;}

.ccRankToolbar__searchWrap{position:relative;flex:1;min-width:200px;}

.ccRankCarousel__track{display:flex;transition:transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);will-change:transform;touch-action:pan-y;}

.ccCard__img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
.ccCard__rank{position:absolute;top:10px;left:10px;min-width:28px;height:28px;border-radius:6px;background:{{property.accentColor}};color:#ffffff;font-family:var(--font-family-heading);font-weight:var(--font-weight-heading);font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px;}

.ccCard__body{padding:{{property.cardPadding}}px;display:flex;flex-direction:column;gap:8px;flex:1;}
.ccCard__name{font-family:var(--font-family-heading);font-weight:var(--font-weight-heading);font-size:{{property.cardNameSize}}px;color:{{property.cardNameColor}};margin:0;line-height:1.3;}

.ccCard__rating{display:flex;align-items:center;gap:8px;}
.ccCard__stars{display:flex;gap:2px;}
.ccCard__star{width:{{property.starSize}}px;height:{{property.starSize}}px;}
.ccCard__star--filled{color:{{property.starFilledColor}};}
.ccCard__star--empty{color:{{property.starEmptyColor}};}
.ccCard__score{font-family:var(--font-family-heading);font-weight:var(--font-weight-heading);font-size:{{property.scoreSize}}px;color:{{property.scoreColor}};}

.ccCard__actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;}

.ccCard__btn:hover{opacity:0.85;}
.ccCard__btn--primary{background:{{property.accentColor}};color:#ffffff;}
.ccCard__btn--secondary{background:transparent;color:{{property.accentColor}};border:1px solid {{property.accentColor}};}
.ccCard__btn--rate{background:{{property.accentColor}};color:#FFFFFF;border:none;font-weight:600;}.ccCard__btn--rate:hover{opacity:0.92;}
.ccRankEmpty{text-align:center;padding:60px 20px;color:{{property.subtitleColor}};font-size:15px;font-family:var(--font-family-body);font-weight:var(--font-weight-body);}.ccCard__unrated{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9999px;background:#F5F5F5;color:#737373;font-size:12px;font-weight:500;letter-spacing:0.02em;align-self:flex-start;}.ccCard__unrated::before{content:"";width:6px;height:6px;border-radius:50%;background:#A3A3A3;display:inline-block;}.ccCard__rating--muted{opacity:0.55;}.ccCard__bars--muted{opacity:0.55;}
.ccRankEmpty__icon{font-size:48px;margin-bottom:16px;opacity:0.4;}
.ccRankEmpty__title{font-family:var(--font-family-heading);font-weight:var(--font-weight-heading);font-size:18px;color:{{property.titleColor}};margin-bottom:8px;}
.ccRankSkeleton{display:grid;grid-template-columns:repeat({{property.gridCols}}, 1fr);gap:{{property.gridGap}}px;}
.ccRankSkeleton__card{border-radius:{{property.cardRadius}}px;overflow:hidden;background:{{property.cardBg}};border:1px solid {{property.cardBorderColor}};}
.ccRankSkeleton__img{width:100%;padding-top:75%;background:{{property.cardImgPlaceholder}};animation:skeletonPulse 1s ease-in-out infinite;}
.ccRankSkeleton__body{padding:{{property.cardPadding}}px;display:flex;flex-direction:column;gap:10px;}
.ccRankSkeleton__line{height:14px;border-radius:4px;background:{{property.cardImgPlaceholder}};animation:skeletonPulse 1s ease-in-out infinite;}
.ccRankSkeleton__line--title{width:60%;height:18px;}
.ccRankSkeleton__line--tag{width:80%;}
.ccRankSkeleton__line--star{width:50%;}
.ccRankSkeleton__line--bar{width:100%;height:6px;}
.ccRankSkeleton__line--btn{width:40%;height:32px;border-radius:{{property.btnRadius}}px;}
@keyframes skeletonPulse{0%{opacity:0.6;}50%{opacity:0.3;}100%{opacity:0.6;}}
@media (max-width:768px){
.ccRankRoot{padding:{{property.paddingTopMobile}}px {{property.paddingRightMobile}}px {{property.paddingBottomMobile}}px {{property.paddingLeftMobile}}px;}
.ccRankHeader__title{font-size:{{property.titleSizeMobile}}px;}
.ccRankHeader__subtitle{font-size:{{property.subtitleSizeMobile}}px;}
.ccRankToolbar{flex-direction:column;align-items:stretch;}
.ccRankToolbar__searchWrap{min-width:100%;}
.ccRankToolbar__sort, .ccRankToolbar__regionFilter{width:100%;}
.ccRankGrid{grid-template-columns:repeat({{property.gridColsMobile}}, 1fr);gap:{{property.gridGapMobile}}px;}
.ccRankCarousel{padding:0;}
.ccRankCarousel__nav{width:40px;height:40px;}.ccRankCarousel__nav--prev{left:4px;}.ccRankCarousel__nav--next{right:4px;}.ccRankCarousel__nav svg{width:18px;height:18px;}
.ccCard__name{font-size:{{property.cardNameSizeMobile}}px;}
.ccRankSkeleton{grid-template-columns:repeat({{property.gridColsMobile}}, 1fr);gap:{{property.gridGapMobile}}px;}
}
</style>
<template>
<div class="ccRankRoot">{{#if property.showHeader}}<div class="ccRankHeader">{{#if property.eyebrow}}<div class="ccRankHeader__eyebrow">{{property.eyebrow}}</div>{{/if}}{{#if property.headerTitle}}<h2 class="ccRankHeader__title">{{property.headerTitle}}</h2>{{/if}}{{#if property.headerSubtitle}}<p class="ccRankHeader__subtitle">{{property.headerSubtitle}}</p>{{/if}}</div>{{/if}}{{#if property.showToolbar}}<div class="ccRankToolbar"><div class="ccRankToolbar__searchWrap"><svg class="ccRankToolbar__searchIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input type="text" class="ccRankToolbar__search" placeholder="골프장 검색..." data-action="search" /></div><select class="ccRankToolbar__sort" data-action="sort"><option value="rating">평점순</option><option value="name">이름순</option><option value="reviews">리뷰순</option></select><select class="ccRankToolbar__regionFilter" data-action="region"><option value="all">전체 지역</option></select></div>{{/if}}<div class="ccRankBody" data-mode="{{property.displayMode}}"></div></div>
</template>
<script>
(function(){
var container = bm.container;
var context = bm.context;
var prop = context.property;
function log() { if (prop.debugLog) { var args = Array.prototype.slice.call(arguments); args.unshift('[CC Ranking]'); console.log.apply(console, args); } }
function collectBridgeData() {
var doc = container.ownerDocument; var stores = doc.querySelectorAll('.ccBridgeStore'); var allItems = [];
for (var s = 0; s < stores.length; s++) { try { var raw = stores[s].textContent; if (!raw || raw.trim() === '') continue; var payload = JSON.parse(raw); if (payload && payload.items && Array.isArray(payload.items)) { for (var i = 0; i < payload.items.length; i++) { var item = payload.items[i]; if (item && item.ccId && item.isVisible !== false) allItems.push(item); } } } catch (err) { log('Bridge parse error:', err); } }
return allItems;
}
function collectRatingData() {
var doc = container.ownerDocument; var stores = doc.querySelectorAll('.ccRatingStore'); var allRatings = [];
for (var s = 0; s < stores.length; s++) { try { var raw = stores[s].textContent; if (!raw || raw.trim() === '') continue; var payload = JSON.parse(raw); if (payload && payload.ratings && Array.isArray(payload.ratings)) { for (var i = 0; i < payload.ratings.length; i++) allRatings.push(payload.ratings[i]); } } catch (err) { log('Rating store parse error:', err); } }
return allRatings;
}
function aggregate(allRatings, bridgeItems) {
var wSt = prop.weightStrategy || 25, wCo = prop.weightCondition || 20, wSc = prop.weightScenery || 10, wSe = prop.weightService || 20, wFa = prop.weightFacility || 10, wPr = prop.weightPrice || 15;
var wTotal = wSt + wCo + wSc + wSe + wFa + wPr; if (wTotal === 0) wTotal = 100;
var m = prop.bayesianM || 30, C = (prop.bayesianC || 40) / 10;
var recentMs = (prop.recentMonths || 12) * 30.44 * 24 * 60 * 60 * 1000, now = Date.now();
var recent = []; for (var i = 0; i < allRatings.length; i++) { var ts = new Date(allRatings[i].createdAt).getTime(); if (!isNaN(ts) && (now - ts) <= recentMs) recent.push(allRatings[i]); }
var userMap = {}; for (var j = 0; j < recent.length; j++) { var r = recent[j]; var key = r.userKey + '|' + r.ccId; if (!userMap[key] || new Date(r.createdAt) > new Date(userMap[key].createdAt)) userMap[key] = r; }
var unique = []; for (var k in userMap) { if (userMap.hasOwnProperty(k)) unique.push(userMap[k]); }
var ccGroups = {}; for (var u = 0; u < unique.length; u++) { var rating = unique[u]; if (!ccGroups[rating.ccId]) ccGroups[rating.ccId] = { strategy: [], condition: [], scenery: [], service: [], facility: [], price: [] }; var g = ccGroups[rating.ccId]; if (typeof rating.ratings.strategy === 'number') g.strategy.push(rating.ratings.strategy); if (typeof rating.ratings.condition === 'number') g.condition.push(rating.ratings.condition); if (typeof rating.ratings.scenery === 'number') g.scenery.push(rating.ratings.scenery); if (typeof rating.ratings.service === 'number') g.service.push(rating.ratings.service); if (typeof rating.ratings.facility === 'number') g.facility.push(rating.ratings.facility); if (typeof rating.ratings.price === 'number') g.price.push(rating.ratings.price); }
function avg(arr) { if (arr.length === 0) return 0; var sum = 0; for (var a = 0; a < arr.length; a++) sum += arr[a]; return sum / arr.length; }
var bridgeMap = {}; for (var b = 0; b < bridgeItems.length; b++) bridgeMap[bridgeItems[b].ccId] = bridgeItems[b];
var results = []; for (var ccId in bridgeMap) { if (!bridgeMap.hasOwnProperty(ccId)) continue; var bridge = bridgeMap[ccId]; var grp = ccGroups[ccId]; var item = { ccId: bridge.ccId, ccName: bridge.ccName, region: bridge.region || '', tags: bridge.tags || '', image: bridge.image || null, imageRatio: bridge.imageRatio || '4_3', btn1Enabled: bridge.btn1Enabled, btn1Label: bridge.btn1Label || '', btn1Url: bridge.btn1Url || '', btn1NewTab: bridge.btn1NewTab, btn2Enabled: bridge.btn2Enabled, btn2Label: bridge.btn2Label || '', btn2Url: bridge.btn2Url || '', btn2NewTab: bridge.btn2NewTab }; var minReviewsForBayes = (prop.minReviewsForBayes || 3); if (grp && grp.strategy.length > 0) { var v = grp.strategy.length; var stAvg = avg(grp.strategy), coAvg = avg(grp.condition), scAvg = avg(grp.scenery), seAvg = avg(grp.service), faAvg = avg(grp.facility), prAvg = avg(grp.price); var rawOverall = (stAvg * wSt + coAvg * wCo + scAvg * wSc + seAvg * wSe + faAvg * wFa + prAvg * wPr) / wTotal; if (v >= minReviewsForBayes) { item.overall = (v / (v + m)) * rawOverall + (m / (v + m)) * C; } else { item.overall = rawOverall; } item.ratings = { strategy: stAvg, condition: coAvg, scenery: scAvg, service: seAvg, facility: faAvg, price: prAvg }; item.reviewCount = v; item.isUnrated = false; } else { item.ratings = null; item.overall = null; item.reviewCount = 0; item.isUnrated = true; } results.push(item); }
results.sort(function(a, b) { if (a.isUnrated !== b.isUnrated) return a.isUnrated ? 1 : -1; return (b.overall || 0) - (a.overall || 0); }); return results;
}
function renderStars(score, size) {
var html = '<div class="ccCard__stars">'; for (var i = 1; i <= 5; i++) { var pct = Math.min(100, Math.max(0, (score - (i - 1)) * 100)); if (pct >= 100) { html += '<svg class="ccCard__star ccCard__star--filled" width="' + size + '" height="' + size + '" viewBox="0 0 20 20"><path d="M10 1l2.39 4.84 5.34.78-3.87 3.77.91 5.33L10 13.27l-4.77 2.51.91-5.33L2.27 6.62l5.34-.78L10 1z" fill="currentColor"/></svg>'; } else if (pct <= 0) { html += '<svg class="ccCard__star ccCard__star--empty" width="' + size + '" height="' + size + '" viewBox="0 0 20 20"><path d="M10 1l2.39 4.84 5.34.78-3.87 3.77.91 5.33L10 13.27l-4.77 2.51.91-5.33L2.27 6.62l5.34-.78L10 1z" fill="currentColor"/></svg>'; } else { var uid = 's' + i + '_' + Math.random().toString(36).substr(2, 5); html += '<svg class="ccCard__star" width="' + size + '" height="' + size + '" viewBox="0 0 20 20"><defs><linearGradient id="' + uid + '"><stop offset="' + pct + '%" stop-color="' + prop.starFilledColor + '"/><stop offset="' + pct + '%" stop-color="' + prop.starEmptyColor + '"/></linearGradient></defs><path d="M10 1l2.39 4.84 5.34.78-3.87 3.77.91 5.33L10 13.27l-4.77 2.51.91-5.33L2.27 6.62l5.34-.78L10 1z" fill="url(#' + uid + ')"/></svg>'; } } html += '</div>'; return html;
}
var BAR_LABELS = { strategy: '코스 전략성', condition: '코스 컨디션', scenery: '경관', service: '서비스', facility: '시설', price: '가격 만족도' };
function renderBars(ratings, muted) { var mc = muted ? ' ccCard__bars--muted' : ''; var html = '<div class="ccCard__bars' + mc + '">'; var keys = ['strategy', 'condition', 'scenery', 'service', 'facility', 'price']; for (var k = 0; k < keys.length; k++) { var key = keys[k]; var val = ratings[key] || 0; var pct = (val / 5) * 100; var valText = muted ? '—' : val.toFixed(1); html += '<div class="ccCard__barRow"><span class="ccCard__barLabel">' + BAR_LABELS[key] + '</span><div class="ccCard__barTrack"><div class="ccCard__barFill" style="width:' + pct + '%"></div></div><span class="ccCard__barValue">' + valText + '</span></div>'; } html += '</div>'; return html; }
function renderCard(item, rank) {
var imgRatioClass = 'ccCard__imgWrap--' + (item.imageRatio || '4_3');
var imgSrc = item.image || 'https://ss3-prod-static-files.s3.ap-northeast-2.amazonaws.com/block-image-library/sports/image1.jpg';
var fb = 'https://ss3-prod-static-files.s3.ap-northeast-2.amazonaws.com/block-image-library/lifestyle/image1.jpg';
var html = '<div class="ccCard" data-ccid="' + item.ccId + '">';
html += '<div class="ccCard__imgWrap ' + imgRatioClass + '"><img class="ccCard__img" src="' + imgSrc + '" alt="' + item.ccName + '" loading="lazy" onerror="this.src=\'' + fb + '\'" /><div class="ccCard__rank">' + rank + '</div>';
if (item.region) html += '<div class="ccCard__region">' + item.region + '</div>';
html += '</div><div class="ccCard__body"><h3 class="ccCard__name">' + item.ccName + '</h3>';
if (item.tags) html += '<div class="ccCard__tags">' + item.tags + '</div>';
if (item.isUnrated) { html += '<span class="ccCard__unrated">평가 대기</span>'; html += '<div class="ccCard__rating ccCard__rating--muted">' + renderStars(0, prop.starSize) + '<span class="ccCard__score">—</span><span class="ccCard__reviewCount">(0)</span></div>'; if (prop.showBars) html += renderBars({strategy:0,condition:0,scenery:0,service:0,facility:0,price:0}, true); } else { var ov = item.overall || 0; html += '<div class="ccCard__rating">' + renderStars(ov, prop.starSize) + '<span class="ccCard__score">' + ov.toFixed(2) + '</span><span class="ccCard__reviewCount">(' + (item.reviewCount || 0) + ')</span></div>'; if (prop.showBars && item.ratings) html += renderBars(item.ratings); }
html += '<div class="ccCard__actions"><button class="ccCard__btn ccCard__btn--rate" data-action="rate" data-ccid="' + item.ccId + '" data-ccname="' + item.ccName + '">평가하기</button>';
if (item.btn1Enabled && item.btn1Label) { var t1 = item.btn1NewTab ? ' target="_blank" rel="noopener noreferrer"' : ''; html += '<a class="ccCard__btn ccCard__btn--secondary" href="' + (item.btn1Url || '#') + '"' + t1 + '>' + item.btn1Label + '</a>'; }
if (item.btn2Enabled && item.btn2Label) { var t2 = item.btn2NewTab ? ' target="_blank" rel="noopener noreferrer"' : ''; html += '<a class="ccCard__btn ccCard__btn--secondary" href="' + (item.btn2Url || '#') + '"' + t2 + '>' + item.btn2Label + '</a>'; }
html += '</div></div></div>'; return html;
}
function renderSkeleton() { var cols = prop.gridCols || 3; var count = Math.min(cols * 2, prop.maxCards || 12); var html = '<div class="ccRankSkeleton">'; for (var i = 0; i < count; i++) { html += '<div class="ccRankSkeleton__card"><div class="ccRankSkeleton__img"></div><div class="ccRankSkeleton__body"><div class="ccRankSkeleton__line ccRankSkeleton__line--title"></div><div class="ccRankSkeleton__line ccRankSkeleton__line--tag"></div><div class="ccRankSkeleton__line ccRankSkeleton__line--star"></div><div class="ccRankSkeleton__line ccRankSkeleton__line--bar"></div><div class="ccRankSkeleton__line ccRankSkeleton__line--bar"></div><div class="ccRankSkeleton__line ccRankSkeleton__line--btn"></div></div></div>'; } html += '</div>'; return html; }
function renderBoardMissing() { return '<div class="ccRankEmpty"><div class="ccRankEmpty__icon">&#9971;</div><div class="ccRankEmpty__title">브리지 블록을 배치해 주세요</div><p>푸터에 CC 데이터 브리지와 CC 평점 브리지 블록을 배치하면 자동으로 데이터를 읽어옵니다.</p></div>'; }
var state = { searchQuery: '', sortBy: 'rating', regionFilter: 'all', carouselIndex: 0 };
var ccData = [];

} else { body.innerHTML = '<div class="ccRankGrid">' + ch + '</div>'; }

/* ====== Touch Swipe ====== */
var touchStartX = 0, touchDelta = 0, isSwiping = false, activePointerId = null;

track.addEventListener('pointermove', onPointerMove, { passive: false });

/* ====== Resize handler ====== */

if (cacheDur > 0) { try { var cached = bm.sessionStorage.getItem('cc_rating_cache'); if (cached && cached.expiry && Date.now() < cached.expiry && cached.data) { ccData = cached.data; renderAll(); return; } } catch (e) {} }

/* ====== Events ====== */
var searchTimer = null;
container.addEventListener('input', function(e) { if (e.target.matches('[data-action="search"]')) { if (searchTimer) clearTimeout(searchTimer); searchTimer = setTimeout(function() { state.searchQuery = e.target.value || ''; renderAll(); }, 300); } }, true);
container.addEventListener('change', function(e) { if (e.target.matches('[data-action="sort"]')) { state.sortBy = e.target.value; renderAll(); } if (e.target.matches('[data-action="region"]')) { state.regionFilter = e.target.value; renderAll(); } }, true);
container.addEventListener('click', function(e) {

var nb = e.target.closest('[data-action="carousel-next"]'); if (nb) { state.carouselIndex++; updateCarouselPosition(true); return; }

/* ====== Init ====== */
loadData();

bm.onContextChange = function() { prop = context.property; renderAll(); };
bm.onDestroy = function() { if (searchTimer) clearTimeout(searchTimer); if (loadRetryTimer) clearTimeout(loadRetryTimer); if (pollTimer) clearInterval(pollTimer); if (resizeTimer) clearTimeout(resizeTimer); if (resizeObs) resizeObs.disconnect(); };

})();
